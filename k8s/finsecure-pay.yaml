apiVersion: v1
kind: Namespace
metadata:
  name: finsecure
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: finsecure-pay-config
  namespace: finsecure
data:
  TRANSACTIONS_MAX_AMOUNT: "10000.00"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsecure-pay-api
  namespace: finsecure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finsecure-pay-api
  template:
    metadata:
      labels:
        app: finsecure-pay-api
    spec:
      containers:
        - name: finsecure-pay-api
          image: khinmyohan91/finsecure-pay-api:1.0.0
            ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: finsecure-pay-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: finsecure-pay-api
---
apiVersion: v1
kind: Service
metadata:
  name: finsecure-pay-service
  namespace: finsecure
spec:
  type: LoadBalancer
  selector:
    app: finsecure-pay-api
  ports:
    - name: http
      port: 80
      targetPort: http